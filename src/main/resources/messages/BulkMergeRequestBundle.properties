# Bulk Merge Requests, English default bundle.
#
# Values are MessageFormat patterns: escape a literal single quote as '' and keep the {0} indices,
# because a translation may need a different word order.
#
# Grouped by where the text appears and, within a group, in the order the user meets it. That reads
# better for whoever translates this than an alphabetical list would.

