[versions]
# Kotlin drives both the JVM plugin and the serialization plugin; they must match.
kotlin = "2.3.21"
intellijPlatform = "2.18.1"
spotless = "8.9.0"
changelog = "2.5.0"
ktlint = "1.8.0"

# The IDE this plugin is built against. sinceBuild in build.gradle.kts follows from it.
intellijIdea = "2025.3.6.1"

kotlinxSerialization = "1.9.0"
junit = "5.11.4"
junitPlatform = "1.11.4"
mockwebserver = "4.12.0"
testcontainers = "1.21.4"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellijPlatform" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
